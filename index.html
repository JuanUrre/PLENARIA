*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f1f4f9;color:#1b2430}

  app.innerHTML=`<div class="card" style="max-width:380px;margin:30px auto;text-align:center"><img src="${LOGO}" style="height:130px"><h3>${reg?'Crear mi cuenta':'Ingreso de consejeros'}</h3>
  ${reg?'<input id="nm" placeholder="Nombre completo">':''}<input id="em" type="email" placeholder="Correo"><input id="pw" type="password" placeholder="Contraseña (mínimo 6 caracteres)">
  <button id="go" style="width:100%">${reg?'Registrarme':'Ingresar'}</button><p class="err">${esc(err)}</p>
  <p><a href="#" id="sw">${reg?'Ya tengo cuenta':'Soy consejero y aún no tengo cuenta'}</a></p></div>`;
  sw.onclick=e=>{e.preventDefault();loginView('',reg?'in':'up')};
  go.onclick=async()=>{
    if(reg){if(!nm.value.trim())return loginView('Escribe tu nombre','up');
      const {error}=await sb.auth.signUp({email:em.value.trim(),password:pw.value,options:{data:{nombre:nm.value.trim()}}});
      if(error)loginView(error.message,'up');}
    else{const {error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});
      if(error)loginView('Correo o contraseña incorrectos');}
  };
}

async function load(){
  const [p,q,v]=await Promise.all([
    sb.from('profiles').select('*').order('nombre'),
    sb.from('proposiciones').select('*').order('created_at',{ascending:false}),
    sb.from('votos').select('*')]);
  profiles=p.data||[];props=q.data||[];votos=v.data||[];
  me=profiles.find(x=>x.id===session.user.id);
  if(!me){userEl.innerHTML='<button class="sec" onclick="sb.auth.signOut()">Salir</button>';app.innerHTML='<div class="card">Tu cuenta no está habilitada. Contacta a la mesa directiva.</div>';return;}
  render();
}

function render(){
  const mesa=me.rol==='mesa',ap=profiles.filter(x=>x.aprobado),total=ap.length;
  userEl.innerHTML=`${esc(me.nombre)} ${mesa?'· <b>'+esc(me.cargo||'Mesa directiva')+'</b>':''} <button class="sec" onclick="sb.auth.signOut()">Salir</button>`;
  if(!me.aprobado){app.innerHTML='<div class="card" style="text-align:center"><img src="'+LOGO+'" style="height:110px"><h3>⏳ Registro recibido</h3><p>La mesa directiva debe aprobar tu cuenta. Esta pantalla se actualizará sola.</p></div>';return;}
  let h='';
  const pen=profiles.filter(x=>!x.aprobado);
  if(mesa&&pen.length)h+=`<div class="card"><h3>Solicitudes de registro (${pen.length})</h3>${pen.map(x=>`<div class="row" style="align-items:center;justify-content:space-between"><span>${esc(x.nombre)}</span><span><button class="si" onclick="aprobar('${x.id}')">Aprobar</button> <button class="sec" onclick="rechazar('${x.id}')">Rechazar</button></span></div>`).join('')}</div>`;
  if(mesa)h+=`<div class="card"><h3>Nueva proposición</h3><input id="t" placeholder="Título"><textarea id="d" rows="3" placeholder="Texto de la proposición"></textarea><button onclick="crear()">Guardar como borrador</button></div>`;
  if(!props.length)h+=`<div class="card">No hay proposiciones todavía.</div>`;
  for(const p of props){
    const vs=votos.filter(v=>v.proposicion_id===p.id),mio=vs.find(v=>v.user_id===me?.id)?.voto;
    const cnt=k=>vs.filter(v=>v.voto===k).length;
    h+=`<div class="card"><span class="badge ${p.estado}">${p.estado.toUpperCase()}</span><h3>${esc(p.titulo)}</h3><p>${esc(p.descripcion)}</p>`;
    if(p.estado!=='borrador'){
      h+=`<p style="margin-top:10px"><b>Votaron ${vs.length} de ${total}</b></p>`;
      for(const [k,l,,c] of OPC){
        const nom=vs.filter(v=>v.voto===k).map(v=>profiles.find(x=>x.id===v.user_id)?.nombre).filter(Boolean).sort().join(', ');
        h+=`<div class="lbl"><span>${l}</span><b>${cnt(k)}</b></div><div class="bar"><i style="width:${total?cnt(k)/total*100:0}%;background:${c}"></i></div><p class="names">${esc(nom)||'—'}</p>`;
      }
      const pend=ap.filter(x=>!vs.some(v=>v.user_id===x.id)).map(x=>x.nombre).join(', ');
      if(p.estado==='abierta'&&pend)h+=`<p class="names"><b>Faltan por votar:</b> ${esc(pend)}</p>`;
    }
    if(p.estado==='abierta')h+=`<div class="row">${OPC.map(([k,l,c])=>`<button class="${c} ${mio===k?'sel':''}" onclick="votar('${p.id}','${k}')">${l}</button>`).join('')}</div>`+(mio?`<p class="names">Tu voto: <b>${mio}</b> (puedes cambiarlo mientras esté abierta)</p>`:'');
    if(p.estado==='cerrada'){const s=cnt('si'),n=cnt('no');
      h+=s>n?`<div class="res ok">✅ APROBADA (${s} a favor, ${n} en contra)</div>`:s<n?`<div class="res bad">❌ NEGADA (${s} a favor, ${n} en contra)</div>`:`<div class="res eq">⚖️ EMPATE (${s} - ${n})</div>`;}
    if(mesa){h+=`<div class="row">`;
      if(p.estado==='borrador')h+=`<button onclick="estado('${p.id}','abierta')">▶ Abrir votación</button>`;
      if(p.estado==='abierta')h+=`<button class="no" onclick="estado('${p.id}','cerrada')">■ Cerrar votación</button>`;
      if(p.estado==='cerrada')h+=`<button class="sec" onclick="estado('${p.id}','abierta')">Reabrir</button>`;
      h+=`<button class="sec" onclick="borrar('${p.id}')">Eliminar</button></div>`;}
    h+=`</div>`;
  }
  const y=scrollY;app.innerHTML=h;scrollTo(0,y);
}
async function aprobar(id){await sb.from('profiles').update({aprobado:true}).eq('id',id);load();}
async function rechazar(id){if(confirm('¿Rechazar este registro?')){await sb.from('profiles').delete().eq('id',id);load();}}
async function crear(){const t=document.getElementById('t').value.trim();if(!t)return;
  await sb.from('proposiciones').insert({titulo:t,descripcion:document.getElementById('d').value.trim()});load();}
async function estado(id,e){await sb.from('proposiciones').update({estado:e}).eq('id',id);load();}
async function borrar(id){if(confirm('¿Eliminar esta proposición y sus votos?')){await sb.from('proposiciones').delete().eq('id',id);load();}}
async function votar(id,voto){const {error}=await sb.from('votos').upsert({proposicion_id:id,user_id:me.id,voto},{onConflict:'proposicion_id,user_id'});
  if(error)alert('No se pudo registrar el voto (¿la votación sigue abierta?)');load();}
init();
</script></body></html>
